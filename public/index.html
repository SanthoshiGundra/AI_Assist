<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local AI Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #e0e0e0; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    #chat { border: 1px solid #333; height: 400px; overflow-y: auto; padding: 15px; border-radius: 8px; background: #1e1e1e; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 6px; max-width: 80%; line-height: 1.4; white-space: pre-wrap; }
    .user { background: #005fb8; align-self: flex-end; color: white; }
    .bot { background: #2d2d2d; align-self: flex-start; color: #e0e0e0; }
    .input-row { display: flex; gap: 10px; margin-top: 15px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: white; font-size: 16px; }
    button { padding: 12px 20px; border-radius: 6px; border: none; background: #0078d4; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #005fb8; }
  </style>
</head>
<body>
  <h2>Local AI Assistant</h2>
  <div id="chat"></div>
  <div class="input-row">
    <input type="text" id="prompt" placeholder="Ask something..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">Send</button>
  </div>

  <script>
    async function send() {
      const input = document.getElementById('prompt');
      const prompt = input.value.trim();
      if (!prompt) return;

      const chat = document.getElementById('chat');
      chat.innerHTML += `<div class="msg user">${prompt}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.innerText = 'Thinking...';
      chat.appendChild(botMsg);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        botMsg.innerText = data.response || data.error;
      } catch (err) {
        botMsg.innerText = 'Error connecting to local server.';
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
